name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven + JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run backend test suite
        # Uses the runner's system Maven, not the project's ./mvnw wrapper — this repo only
        # has a Windows mvnw.cmd committed, no Unix mvnw shell script, so the wrapper would
        # fail outright on this Linux runner.
        run: mvn test --batch-mode --no-transfer-progress

  frontend:
    name: Frontend (ESLint, TypeScript, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm run test

      - name: Build
        run: npm run build
