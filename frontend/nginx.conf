server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy to the backend — the browser never sees a
    # cross-origin request, so this mirrors the Vite dev server's own /api proxy
    # (see frontend/vite.config.ts) and needs no CORS configuration on either side.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router client-side routing: fall back to index.html for any path that
    # isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
