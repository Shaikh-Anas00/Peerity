# Production Profile Overrides
spring.jpa.hibernate.ddl-auto=validate
spring.session.jdbc.initialize-schema=never

# Argon2id: production-grade parameters (Spring Security 5.8 defaults)
# saltLength=16, hashLength=32, parallelism=8, memory=262144 KB (256 MB), iterations=3
peerity.argon2.salt-length=16
peerity.argon2.hash-length=32
peerity.argon2.parallelism=8
peerity.argon2.memory=262144
peerity.argon2.iterations=3
