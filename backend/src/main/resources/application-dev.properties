# ─── Dev Profile Overrides ────────────────────────────────────────────────────
# Lighter Argon2 parameters so password hashing takes ~150-250ms instead of
# the 5-8 seconds the production defaults impose. Seed startup goes from ~90s
# to <5s. DO NOT use these settings in production.
#
# Argon2id params (Spring Security Argon2PasswordEncoder constructor):
#   saltLength  = 16  bytes
#   hashLength  = 32  bytes
#   parallelism = 1   thread
#   memory      = 8192 KB  (8 MB — vs prod 256 MB)
#   iterations  = 1   (vs prod 3)
peerity.argon2.salt-length=16
peerity.argon2.hash-length=32
peerity.argon2.parallelism=1
peerity.argon2.memory=8192
peerity.argon2.iterations=1

# Disable redundant DDL checks on boot (tables already exist in MySQL trustreview_db)
spring.jpa.hibernate.ddl-auto=none
spring.session.jdbc.initialize-schema=never
