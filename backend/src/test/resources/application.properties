# ──────────────────────────────────────────────────────────────────────────────
# Test-scope application.properties
# Applied when running tests via mvn test (overrides main/resources/application.properties)
# ──────────────────────────────────────────────────────────────────────────────

# H2 in-memory DB (no MySQL required for tests)
spring.datasource.url=jdbc:h2:mem:trustreview_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Auto-create schema from JPA entities; teardown after test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ── Spring Session: use in-memory (no JDBC) ───────────────────────────────────
# This prevents "Table SPRING_SESSION not found" errors in tests.
# MockMvc with @WithMockUser doesn't rely on real session persistence.
spring.session.store-type=none

# Stub out PHP service URL (not called in unit/integration tests)
trustreview.php.url=http://127.0.0.1:8000
trustreview.client.url=http://localhost:5173
trustreview.internal.service-key=TrustReview-Internal-Secret-Key-Phase3-Secure
audit.ledger.hmac-secret=TrustReview-Audit-Ledger-HMAC-Secret-Key-Phase6-Production-Grade

# Suppress banner in test output
spring.main.banner-mode=off
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.com.trustreview=INFO

# Server port (avoids port conflict with running dev server)
server.port=0
