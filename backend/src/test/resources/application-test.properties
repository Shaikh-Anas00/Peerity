# Test profile — uses H2 in-memory DB, no MySQL or PHP required

# Use H2 instead of MySQL for tests
spring.datasource.url=jdbc:h2:mem:trustreview_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate auto-creates schema from JPA entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Use in-memory (not JDBC) session store for tests
spring.session.store-type=none

# Disable DataInitializer seed data in tests (no real users needed)
trustreview.seed.enabled=false

# Keep same service key as production (not sensitive in tests)
trustreview.internal.service-key=TrustReview-Internal-Secret-Key-Phase3-Secure
trustreview.php.url=http://127.0.0.1:8000
trustreview.client.url=http://localhost:5173

# Suppress Spring Boot banner in test output
spring.main.banner-mode=off
